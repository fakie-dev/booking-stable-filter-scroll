name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate source
        run: |
          node --check booking-stable-filter-scroll.user.js
          node scripts/validate.mjs

      - name: Verify tag matches userscript version
        shell: bash
        run: |
          VERSION=$(sed -n 's#^// @version[[:space:]]*##p' booking-stable-filter-scroll.user.js | head -n1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match userscript version v$VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            booking-stable-filter-scroll.user.js \
            booking-stable-filter-scroll.meta.js \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
