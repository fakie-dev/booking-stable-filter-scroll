name: Validate userscript

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Check source and metadata
        run: npm run check

      - name: Test anchor behavior
        run: npm test

      - name: Verify committed build
        run: git diff --exit-code -- booking-stable-filter-scroll.user.js booking-stable-filter-scroll.meta.js
